# aisupport.progmasoft.com on the second Progmasoft server. The access log has no client address, as on the first
# server: Progmasoft keeps IP addresses only with ViGet uploads (https://progmasoft.com/privacy).

log_format aisupport '[$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name aisupport.progmasoft.com;
    access_log /var/log/nginx/access.log aisupport;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://aisupport.progmasoft.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aisupport.progmasoft.com;
    access_log /var/log/nginx/access.log aisupport;

    ssl_certificate /etc/letsencrypt/live/aisupport.progmasoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aisupport.progmasoft.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Answers are streamed as server-sent events; nginx passes each piece on at once.
    location = /api/ask {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location = /healthz {
        return 404;
    }
}
