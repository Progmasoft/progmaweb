# The Maven repository of Progmasoft: /tazel holds com.progmasoft.tazel:tazel-api,
# which plugins of Tazel compile against. Static files only, copied from the
# Gradle staging repository of a release; see ops/README.md.
server {
    listen 80;
    listen [::]:80;
    server_name maven.progmasoft.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://maven.progmasoft.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name maven.progmasoft.com;

    ssl_certificate /etc/letsencrypt/live/progmasoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/progmasoft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /srv/maven;
    autoindex on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;

    location = / {
        return 302 https://maven.progmasoft.com/tazel/;
    }

    location ^~ /tazel/ {
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
