        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $progmaweb_upgrade;
        proxy_set_header Connection $progmaweb_connection;
        proxy_read_timeout 60s;
    }
}

# ViGet, the package registry, was closed on 2026-11-18: every address of it
# answers 410 Gone.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name viget.progmasoft.com;

    ssl_certificate /etc/letsencrypt/live/progmasoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/progmasoft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        default_type text/plain;
        return 410 "ViGet was closed.\n";
    }
}

# Progmasoft OAuth: the OAuth 2.1 and OpenID Connect provider of Progmasoft
# accounts. credentials.progmasoft.com is the issuer: the discovery documents,
# the key set and the endpoints clients call directly go to the account API;
# its home page is a page of the Next.js site.
server {
    listen 80;
    listen [::]:80;
    server_name credentials.progmasoft.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://credentials.progmasoft.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name credentials.progmasoft.com;

    ssl_certificate /etc/letsencrypt/live/progmasoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/progmasoft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The protocol endpoints, the discovery documents and the JSON endpoints of
    # the pages belong to the account API; it answers only OAuth paths here.
    location ~ ^/(connect|\.well-known|api)/ {
        proxy_pass http://127.0.0.1:5085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    # The home page of the issuer is a page of the Progmasoft site.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $progmaweb_upgrade;
        proxy_set_header Connection $progmaweb_connection;
        proxy_read_timeout 60s;
    }
}

