# Only a WebSocket upgrade reaches the applications. Forwarding any Upgrade
# header with "Connection: upgrade" on every request would let a client ask an
# upstream for another protocol (h2c) behind Nginx.
map $http_upgrade $progmaweb_upgrade {
    default   "";
    ~*^websocket$ websocket;
}

map $progmaweb_upgrade $progmaweb_connection {
    default   "";
    websocket upgrade;
}

server {
    listen 80;
    listen [::]:80;
    server_name progmasoft.com www.progmasoft.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://progmasoft.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name account.progmasoft.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://account.progmasoft.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name viget.progmasoft.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://viget.progmasoft.com$request_uri;
