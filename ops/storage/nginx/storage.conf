# https://storage.progmasoft.com: published files of Progmasoft, such as the
# license texts in /pm-spl/<version>/, each beside its .sha256sums. Files only:
# no listing, no pages. Served from /srv/progmasoft-storage; installed as
# /etc/nginx/conf.d/storage.conf.

server {
    listen 80;
    listen [::]:80;
    server_name storage.progmasoft.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://storage.progmasoft.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name storage.progmasoft.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/progmasoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/progmasoft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /srv/progmasoft-storage;
    autoindex off;
    client_max_body_size 1k;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Robots-Tag "noindex" always;

    # A published license text never changes; a change is a new version.
    location ~ "^/pm-spl/[0-9]+\.[0-9]+/" {
        limit_except GET {
            deny all;
        }
        types {
            text/plain txt sha256sums;
            text/markdown md;
            text/x-rst rst;
        }
        default_type application/octet-stream;
        charset utf-8;
        charset_types text/plain text/markdown text/x-rst;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
